name: Semantic Release

on:
  push:
    branches:
      - master
  # Pushes made with GITHUB_TOKEN don't trigger workflows, so run after the
  # scheduled update instead.
  workflow_run:
    workflows: ["Update schema"]
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update name to support OIDC
        run: npm install -g npm@latest
      - run: npm config list
      - run: npm ci
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
